name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -v

  agentdojo-adapter-tests:
    name: AgentDojo adapter tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install AgentDojo eval dependencies
        run: pip install -r evals/requirements-agentdojo.txt

      - name: Run AgentDojo adapter tests
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s evals/tests -v
